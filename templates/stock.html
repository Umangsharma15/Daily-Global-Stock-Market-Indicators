<!DOCTYPE html>
<html>
<head>
    <title>Stock Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>Stock Price Predictor</h1>
    <p class="subtitle">Predict next-day closing price</p>

    <form method="post">
        <div class="grid">

            <label>Open</label>
            <input type="number" step="0.01" name="Open" required>

            <label>High</label>
            <input type="number" step="0.01" name="High" required>

            <label>Low</label>
            <input type="number" step="0.01" name="Low" required>

            <label>Close</label>
            <input type="number" step="0.01" name="Close" required>

            <label>Volume</label>
            <input type="number" step="0.01" name="Volume" required>

            <label>Daily Change %</label>
            <input type="number" step="0.01" name="Daily_Change_Percent" required>

            <label>Index Code</label>
            <input type="number" name="Index_Code" required>

        </div>

        <button type="submit">Predict</button>
    </form>

    <div class="result">
        {{ context }}
    </div>
</div>

</body>
</html>
